name: Daily CATAPULT Fetch & Deploy

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC = 2:00am Mexico City (CST, UTC-6)
  workflow_dispatch:      # allow manual trigger from GitHub UI

jobs:
  fetch-process-deploy:
    runs-on: ubuntu-latest

    steps:

      # --- Checkout all repos ---

      - name: Checkout process_catapult
        uses: actions/checkout@v4

      - name: Checkout club_america_dashboard
        uses: actions/checkout@v4
        with:
          repository: mr2293/club_america_dashboard
          token: ${{ secrets.GH_PAT }}
          path: club_america_dashboard

      - name: Checkout dashboard_femenil
        uses: actions/checkout@v4
        with:
          repository: mr2293/dashboard_femenil
          token: ${{ secrets.GH_PAT }}
          path: dashboard_femenil

      # --- Set up R ---

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            libuv1-dev

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c(
            'mice', 'httr', 'vctrs', 'lubridate', 'tidyr',
            'anytime', 'dplyr', 'jsonlite', 'purrr',
            'tidyverse', 'ggplot2', 'readxl', 'skimr', 'scales',
            'readr', 'writexl', 'zoo', 'openxlsx', 'tidylog',
            'pacman', 'rsconnect'
          ), repos = 'https://cran.rstudio.com/')"

      # --- Fetch & process ---

      - name: Run primer equipo processing
        env:
          CATAPULT_TOKEN: ${{ secrets.CATAPULT_TOKEN }}
          DASHBOARD_CARGAS_CSV: ${{ github.workspace }}/club_america_dashboard/apps/dashboard_cargas/micros/micros_shiny_comb.csv
          CARGAS7_XLSX: ${{ github.workspace }}/club_america_dashboard/apps/cargas_fisicas_7/data/Sessions_micro01.xlsx
          SESSION_CALC_XLSX: ${{ github.workspace }}/club_america_dashboard/apps/session_calculator/data/stats_df.xlsx
        run: Rscript catapult_process_1ra.R

      - name: Run femenil processing
        env:
          CATAPULT_TOKEN_FEMENIL: ${{ secrets.CATAPULT_TOKEN_FEMENIL }}
          DASHBOARD_FEMENIL_CSV: ${{ github.workspace }}/dashboard_femenil/micros/micros_shiny_comb_fem.csv
        run: Rscript catapult_process_femenil.R

      # --- Commit updated data files ---

      - name: Commit data to club_america_dashboard
        run: |
          cd ${{ github.workspace }}/club_america_dashboard
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add \
            apps/dashboard_cargas/micros/micros_shiny_comb.csv \
            apps/cargas_fisicas_7/data/Sessions_micro01.xlsx \
            apps/session_calculator/data/stats_df.xlsx
          git diff --staged --quiet || git commit -m "chore: update CATAPULT data $(date +'%Y-%m-%d')"
          for i in 1 2 3; do git push && break || sleep 10; done

      - name: Commit data to dashboard_femenil
        run: |
          cd ${{ github.workspace }}/dashboard_femenil
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add micros/micros_shiny_comb_fem.csv
          git diff --staged --quiet || git commit -m "chore: update CATAPULT femenil data $(date +'%Y-%m-%d')"
          for i in 1 2 3; do git push && break || sleep 10; done

      # --- Deploy club_america_dashboard to shinyapps.io ---
      # dashboard_femenil has its own deploy workflow that triggers
      # automatically on push — no need to deploy it here. club_america_dashboard
      # also has its own scheduled update-and-deploy workflow, but we deploy it
      # here too so fresh CATAPULT data goes live immediately instead of
      # waiting for that workflow's next cron run.

      - name: Deploy club_america_dashboard
        env:
          SHINY_ACC_NAME: ${{ secrets.SHINY_ACC_NAME }}
          TOKEN: ${{ secrets.SHINY_TOKEN }}
          SECRET: ${{ secrets.SHINY_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          docker build -t club_america_dashboard club_america_dashboard/
          docker run --rm \
            -e SHINY_ACC_NAME="${{ secrets.SHINY_ACC_NAME }}" \
            -e TOKEN="${{ secrets.SHINY_TOKEN }}" \
            -e SECRET="${{ secrets.SHINY_SECRET }}" \
            -e ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            club_america_dashboard
